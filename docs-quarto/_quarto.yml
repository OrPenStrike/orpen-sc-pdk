project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "capabilities/*.qmd"
    - "docs/notebooks/public_electrostatic_workflow.ipynb"
    - "docs/notebooks/public_driven_workflow.ipynb"
    - "docs/notebooks/public_eigenmode_workflow.ipynb"
    - "sgb-notebooks/martinis2022_ribbon_route_a.ipynb"
    - "sgb-notebooks/martinis2022_ribbon_route_b.ipynb"
    - "sgb-notebooks/martinis2022_ribbon_route_c.ipynb"
    - "reference/*.qmd"
  resources:
    - docs/_static/images/components/*.svg
  pre-render:
    - uv run --project .. --group docs-quarto quartodoc build

website:
  title: "OrPen SC PDK"
  favicon: assets/orpen-mark.svg
  navbar:
    logo: assets/orpen-mark.svg
    background: light
    search: true
    left:
      - text: "Overview"
        href: index.qmd
      - text: "GSim Developing Features"
        href: gsim-developing-features.qmd
      - text: "Issues"
        href: issues.qmd
      - text: "Notebooks"
        href: notebooks.qmd
    right:
      - icon: github
        href: https://github.com/OrPenStrike/orpen-sc-pdk
  sidebar:
    - title: "Overview"
      style: docked
      search: false
      contents:
        - index.qmd
    - title: "GSim Developing Features"
      style: docked
      search: false
      contents:
        - gsim-developing-features.qmd
        - section: "gsim Features"
          contents:
            - text: "Slurm HPC Handoff Package"
              href: capabilities/gsim-slurm-hpc-handoff-package.qmd
            - text: "Resolve/Results"
              href: capabilities/gsim-resolve-results.qmd
        - section: "Context"
          contents:
            - text: "SGB Input Contract"
              href: capabilities/semantic-geometry-builder.qmd
        - text: "API Reference"
          href: reference/index.qmd
    - title: "Issues"
      style: docked
      search: false
      contents:
        - issues.qmd
    - title: "Notebooks"
      style: docked
      search: false
      contents:
        - notebooks.qmd
        - section: "SGB Geometry Tutorials"
          contents:
            - text: "Martinis Ribbon Route A"
              href: sgb-notebooks/martinis2022_ribbon_route_a.ipynb
            - text: "Martinis Ribbon Route B"
              href: sgb-notebooks/martinis2022_ribbon_route_b.ipynb
            - text: "Martinis Ribbon Route C"
              href: sgb-notebooks/martinis2022_ribbon_route_c.ipynb
        - section: "gsim Workflows"
          contents:
            - text: "Public Electrostatic Workflow"
              href: docs/notebooks/public_electrostatic_workflow.ipynb
            - text: "Public Driven Workflow"
              href: docs/notebooks/public_driven_workflow.ipynb
            - text: "Public Eigenmode Workflow"
              href: docs/notebooks/public_eigenmode_workflow.ipynb

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    page-layout: article
    code-copy: true

quartodoc:
  style: pkgdown
  dir: reference
  package: orpen_sc_pdk
  title: API Reference
  sections:
    - title: Package
      desc: Public API exposed from the package root.
      contents:
        - activate
        - get_pdk
        - get_sample_functions
