[build-system]
requires = ["uv_build>=0.10.8,<0.12.0"]
build-backend = "uv_build"

[project]
name = "orpen-sc-pdk"
version = "0.1.0"
description = "OrPen superconducting quantum/RF public PDK for GDSFactory"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "OrPenStrike" }]
keywords = [
  "gdsfactory",
  "layout",
  "pdk",
  "quantum",
  "rf",
  "superconducting",
]
dependencies = [
  "doroutes>=0.2.0",
  "gdsfactory~=9.43.0",
  "networkx>=3.0",
  "numpy>=2.0",
  "pydantic>=2",
  "pyyaml>=6.0",
  "typing-extensions>=4.12.0",
]

[project.urls]
documentation = "https://orpenstrike.github.io/orpen-sc-pdk/"
repository = "https://github.com/OrPenStrike/orpen-sc-pdk/"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "ruff>=0.15.11",
]
gdsfactoryplus = ["gdsfactoryplus==1.8.20", "httpx"]

[dependency-groups]
docs = [
  "griffe<2",
  "ipykernel",
  "jupytext",
  "matplotlib",
  "quartodoc",
]
palace-notebooks = ["scgsim[palace]"]
aedt-notebooks = ["scgsim[aedt]"]
ecosystem-dev = [
  "gplugins",
  "kaleido>=1.0.0",
  "pandas>=2.0",
  "plotly>=6.0.0",
]

[tool.uv.sources]
scgsim = { git = "https://github.com/OrPenStrike/scgsim.git", rev = "74a4d0fd30d343bff192d0133ee6185dd3611f90" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["orpen_sc_pdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-root = ""

[tool.gdsfactoryplus]
name = "orpen_sc_pdk"

[tool.gdsfactoryplus.pdk]
name = "orpen_sc_pdk"
cells_no_model_expected = [
  "indium_bump",
  "indium_ground",
  "resonator",
  "resonator_hanger",
  "resonator_meander",
  "taper",
  "bend_circular",
  "bend_euler",
  "cpw_straight",
  "dicing_edge",
  "interdigital_capacitor",
  "interdigital_capacitor_q3d_coupon",
  "launcher",
  "manhattan_style_junction",
  "martinis2022_differential_ribbon_capacitor",
  "straight",
]
