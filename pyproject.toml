[build-system]
requires = ["uv_build>=0.10.8,<0.12.0"]
build-backend = "uv_build"

[project]
name = "orpen-sc-pdk"
version = "0.1.0"
description = "OrPen superconducting quantum/RF public PDK for GDSFactory"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "OrPenStrike" }]
keywords = [
  "gdsfactory",
  "layout",
  "pdk",
  "quantum",
  "rf",
  "superconducting",
]
dependencies = [
  "doroutes>=0.2.0",
  "gdsfactory~=9.43.0",
  "networkx>=3.0",
  "numpy>=2.0",
  "pydantic>=2",
  "typing-extensions>=4.12.0",
]

[project.urls]
documentation = "https://orpenstrike.github.io/orpen-sc-pdk/"
repository = "https://github.com/OrPenStrike/orpen-sc-pdk/"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "ruff>=0.15.11",
]
gdsfactoryplus = ["gdsfactoryplus", "httpx"]

[dependency-groups]
docs = [
  "ipykernel",
  "jupytext",
  "linkify-it-py",
  "matplotlib",
  "myst-nb>=1.0",
  "nbconvert",
  "pydata-sphinx-theme",
  "sphinx>=9.0",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinx-github-alerts",
  "sphinxcontrib-bibtex",
  "sphinxcontrib-bibtex-urn",
  "sphinxcontrib-mermaid",
  "sphinxcontrib-svgbob",
]
ecosystem-dev = [
  "gplugins",
  "gsim",
]

[tool.uv.sources]
gplugins = { path = "../GDSFactory_Community_Workbench/gplugins", editable = true, group = "ecosystem-dev" }
gsim = { path = "../GDSFactory_Community_Workbench/gsim", editable = true, group = "ecosystem-dev" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["orpen_sc_pdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-root = ""

[tool.gdsfactoryplus]
name = "orpen_sc_pdk"

[tool.gdsfactoryplus.pdk]
name = "orpen_sc_pdk"
cells_no_model_expected = [
  "indium_bump",
  "indium_ground",
  "resonator",
  "resonator_hanger",
  "resonator_meander",
  "taper",
  "bend_circular",
  "bend_euler",
  "cpw_straight",
  "dicing_edge",
  "global_purcell_filter_demo_chip",
  "interdigital_capacitor",
  "launcher",
  "manhattan_style_junction",
  "martinis2022_differential_ribbon_capacitor",
  "single_trace_flip_chip_xs_chip",
  "single_trace_xs_chip",
  "sim_flip_chip_distance",
  "sim_flip_chip_distance_keepout_global_routing_demo",
  "sim_flip_chip_distance_keepout_routing_demo",
  "straight",
  "two_trace_flip_chip_xs_chip",
  "two_trace_xs_chip",
]
