name: Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GSIM_REVISION: bb97148fbb133af43d43b59304b03cd2d6dee985
  SGB_REVISION: 616cfbd4b44e6fcc54295a9addb5f355163397a5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout editable documentation dependencies
        run: |
          mkdir -p ../GDSFactory_Community_Workbench
          git clone --filter=blob:none https://github.com/arfiligol/gsim.git ../GDSFactory_Community_Workbench/gsim
          git -C ../GDSFactory_Community_Workbench/gsim checkout --detach "$GSIM_REVISION"
          git clone --filter=blob:none https://github.com/OrPenStrike/semantic-geometry-builder.git ../semantic_geometry_builder
          git -C ../semantic_geometry_builder checkout --detach "$SGB_REVISION"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: uv sync -p 3.12 --locked --group docs --extra dev
      - run: just docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/_site
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
