project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "*.md"
    - "home/*.md"
    - "features/scgsim-integration.md"
    - "features/docs-theme.md"
    - "public-pdk-examples/*.md"
    - "usage/*.md"
    - "simulation/**/*.qmd"
    - "papers/*.md"
    - "notebooks/Public_Docs/component_gallery.ipynb"
    - "notebooks/ComponentSimulation/SimplePad/aedt_q3d.ipynb"
    - "notebooks/ComponentSimulation/SimplePad/aedt_hfss_eigenmode.ipynb"
    - "notebooks/ComponentSimulation/SimplePad/palace_electrostatic.ipynb"
    - "notebooks/ComponentSimulation/SimplePad/palace_eigenmode.ipynb"
    - "notebooks/ComponentSimulation/CircularPad/palace_eigenmode.ipynb"
    - "notebooks/ComponentSimulation/Kosen2024_Xmon/palace_route_a_electrostatic.ipynb"
    - "notebooks/ComponentSimulation/Kosen2024_Xmon/palace_route_b_electrostatic.ipynb"
    - "notebooks/ComponentSimulation/Kosen2024_Xmon/palace_route_a_eigenmode.ipynb"
    - "notebooks/ComponentSimulation/Kosen2024_Xmon/palace_route_b_eigenmode.ipynb"
    - "notebooks/ComponentSimulation/Kosen2024_Xmon/aedt_q3d.ipynb"
    - "notebooks/ComponentSimulation/Kosen2024_Xmon/electrostatic_boundary_alignment.ipynb"
    - "notebooks/ComponentSimulation/CpwFiniteGround/aedt_hfss_driven_terminal.ipynb"
    - "notebooks/ComponentSimulation/CpwFiniteGround/aedt_hfss_driven_modal.ipynb"
    - "notebooks/ComponentSimulation/CpwFiniteGround/aedt_hfss_eigenmode.ipynb"
    - "notebooks/ComponentSimulation/CpwFiniteGround/palace_eigenmode.ipynb"
    - "notebooks/ComponentSimulation/CpwFiniteGround/aedt_q3d.ipynb"
    - "notebooks/ComponentSimulation/CpwMeanderAirbridge/aedt_hfss_eigenmode_rlc.ipynb"
    - "notebooks/ComponentSimulation/CpwMeanderAirbridge/aedt_hfss_driven_terminal_lumped.ipynb"
    - "notebooks/ComponentSimulation/CpwMeanderAirbridge/aedt_hfss_driven_terminal_wave.ipynb"
    - "notebooks/ComponentSimulation/GeometrySemantics/geometry_source_ownership.ipynb"
    - "notebooks/ComponentSimulation/GeometrySemantics/geometry_curves_holes_transforms.ipynb"
    - "notebooks/ComponentSimulation/GeometrySemantics/geometry_multilevel_contacts.ipynb"
    - "notebooks/CrossSectionSimulation/CpwFiniteGround/aedt_q2d.ipynb"
    - "reference/*.qmd"
    - "!notebooks/src/"
  resources:
    - _static/images/components/*.svg
    - _static/images/test-components/*
    - "notebooks/ComponentSimulation/SimplePad/*.ipynb"
    - "notebooks/ComponentSimulation/CircularPad/*.ipynb"
    - "notebooks/ComponentSimulation/CpwFiniteGround/*.ipynb"
    - "notebooks/ComponentSimulation/CpwMeanderAirbridge/*.ipynb"
    - "notebooks/ComponentSimulation/GeometrySemantics/*.ipynb"
    - "notebooks/CrossSectionSimulation/CpwFiniteGround/*.ipynb"
    - "notebooks/src/ComponentSimulation/**/*.qmd"
    - "notebooks/src/CrossSectionSimulation/**/*.qmd"
  pre-render:
    - uv run --project .. --group docs quartodoc build

website:
  title: "OrPen SC PDK"
  site-url: https://orpenstrike.github.io/orpen-sc-pdk/
  favicon: assets/orpen-mark.svg
  repo-url: https://github.com/OrPenStrike/orpen-sc-pdk
  repo-actions: [edit, issue]
  navbar:
    logo: assets/orpen-mark.svg
    search: true
    left:
      - text: Overview
        href: index.qmd
      - text: Get Started
        href: getting-started.md
      - text: Cells
        href: public-pdk-examples/index.md
      - text: Process
        href: materials-and-technology.md
      - text: Simulation
        href: notebooks.qmd
      - text: API
        href: reference/index.qmd
  sidebar:
    - id: cells
      title: Cells
      collapse-level: 1
      contents:
        - public-pdk-examples/index.md
        - public-pdk-examples/test-components.md
        - public-pdk-examples/component-authoring.md
        - notebooks/Public_Docs/component_gallery.ipynb
    - id: process
      title: Process
      contents:
        - materials-and-technology.md
        - home/pdk-responsibilities.md
    - id: simulation
      title: Simulation
      contents:
        - text: Overview
          href: notebooks.qmd
        - section: Layer 1 · OrPen user requirements
          contents:
            - simulation/requirements/electrostatic-capacitance.qmd
            - simulation/requirements/eigenmode.qmd
            - simulation/requirements/lumped-rlc-eigenmode.qmd
            - simulation/requirements/epr-loss.qmd
            - simulation/requirements/driven-terminal.qmd
            - simulation/requirements/driven-modal.qmd
            - simulation/requirements/q3d-acrl.qmd
            - simulation/requirements/q2d-cross-section.qmd
        - section: Layer 2 · SCGSim tool requirements
          contents:
            - simulation/tools/source-ownership.qmd
            - simulation/tools/curves-holes-transforms.qmd
            - simulation/tools/materials-stack-z.qmd
            - simulation/tools/contacts-multilevel.qmd
            - simulation/tools/mesh-fem-amr.qmd
            - simulation/tools/handoff-resolve-report.qmd
        - section: Notebooks
          contents:
            - simulation/notebooks.qmd
            - features/scgsim-integration.md
            - section: Pad examples
              contents:
                - notebooks/ComponentSimulation/SimplePad/aedt_q3d.ipynb
                - notebooks/ComponentSimulation/SimplePad/aedt_hfss_eigenmode.ipynb
                - notebooks/ComponentSimulation/SimplePad/palace_electrostatic.ipynb
                - notebooks/ComponentSimulation/SimplePad/palace_eigenmode.ipynb
                - notebooks/ComponentSimulation/CircularPad/palace_eigenmode.ipynb
            - section: Xmon examples and historical evidence
              contents:
                - notebooks/ComponentSimulation/Kosen2024_Xmon/palace_route_a_electrostatic.ipynb
                - notebooks/ComponentSimulation/Kosen2024_Xmon/palace_route_b_electrostatic.ipynb
                - notebooks/ComponentSimulation/Kosen2024_Xmon/aedt_q3d.ipynb
                - notebooks/ComponentSimulation/Kosen2024_Xmon/palace_route_a_eigenmode.ipynb
                - notebooks/ComponentSimulation/Kosen2024_Xmon/palace_route_b_eigenmode.ipynb
                - notebooks/ComponentSimulation/Kosen2024_Xmon/electrostatic_boundary_alignment.ipynb
            - section: CPW examples
              contents:
                - notebooks/ComponentSimulation/CpwFiniteGround/aedt_hfss_driven_modal.ipynb
                - notebooks/ComponentSimulation/CpwFiniteGround/aedt_hfss_eigenmode.ipynb
                - notebooks/ComponentSimulation/CpwFiniteGround/palace_eigenmode.ipynb
                - notebooks/ComponentSimulation/CpwFiniteGround/aedt_q3d.ipynb
                - notebooks/CrossSectionSimulation/CpwFiniteGround/aedt_q2d.ipynb
            - section: Launcher / exterior-cut pair
              contents:
                - notebooks/ComponentSimulation/CpwMeanderAirbridge/aedt_hfss_eigenmode_rlc.ipynb
                - notebooks/ComponentSimulation/CpwMeanderAirbridge/aedt_hfss_driven_terminal_lumped.ipynb
                - notebooks/ComponentSimulation/CpwMeanderAirbridge/aedt_hfss_driven_terminal_wave.ipynb
            - section: Source geometry observations
              contents:
                - notebooks/ComponentSimulation/GeometrySemantics/geometry_source_ownership.ipynb
                - notebooks/ComponentSimulation/GeometrySemantics/geometry_curves_holes_transforms.ipynb
                - notebooks/ComponentSimulation/GeometrySemantics/geometry_multilevel_contacts.ipynb
    - id: api
      title: API
      contents:
        - auto: reference

format:
  askr-html:
    css: [styles.css]
    html-math-method: mathjax
    code-copy: true

execute:
  enabled: false

quartodoc:
  style: pkgdown
  dir: reference
  package: orpen_sc_pdk
  title: API Reference
  sections:
    - title: Package
      desc: Public package entry points.
      contents:
        - activate
        - get_pdk
        - get_sample_functions
    - title: Cells
      desc: Public superconducting and RF layout factories.
      contents:
        - cells.airbridge
        - cells.interdigital_capacitor
        - cells.cpw_t_junction
        - cells.launcher
        - cells.mtl_bend_coupling_section
        - cells.n_trace_mtl_section
        - cells.resonator
        - cells.resonator_hanger
        - cells.resonator_meander
        - cells.finite_ground_cpw_coupon
        - cells.cpw_meander_airbridge_lumped_coupon
        - cells.cpw_meander_airbridge_wave_coupon
        - cells.martinis2022_differential_ribbon_capacitor
    - title: Materials
      desc: Copy-returning public material and interface records.
      contents:
        - materials.get_material_records
        - materials.get_material_alias_records
        - materials.get_interface_preset_records
        - materials.validate_material_kind_records
        - materials.validate_material_alias_records
        - materials.validate_interface_preset_records
        - materials.validate_aedt_material_records
